name: Verify KeyCourier

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Unsigned macOS and iOS verification
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          install_root="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          umask 077
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --proto '=https' \
            --tlsv1.2 \
            "$url" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 -c -

          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          tool_dir="$install_root/xcodegen/bin"
          test -x "$tool_dir/xcodegen"
          test "$("$tool_dir/xcodegen" version)" = "Version: $XCODEGEN_VERSION"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Record runner and toolchain
        run: |
          set -euo pipefail
          echo "runner.os=${RUNNER_OS:-unknown}"
          echo "runner.arch=${RUNNER_ARCH:-unknown}"
          echo "image.os=${ImageOS:-unknown}"
          echo "image.version=${ImageVersion:-unknown}"
          xcode-select -p
          xcodebuild -version
          swift --version
          xcodegen version

      - name: Run repository verification
        run: ./scripts/verify-release.sh
